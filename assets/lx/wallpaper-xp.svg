<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2E7CC8"/>
    <stop offset="38%" stop-color="#5AA6DE"/>
    <stop offset="62%" stop-color="#9FCFEB"/>
    <stop offset="82%" stop-color="#CDE6F4"/>
    <stop offset="100%" stop-color="#E7F2F8"/>
  </linearGradient>
  <radialGradient id="sun" cx="28%" cy="22%" r="32%">
    <stop offset="0%" stop-color="#FFF8D8" stop-opacity=".95"/>
    <stop offset="18%" stop-color="#FFE9A8" stop-opacity=".55"/>
    <stop offset="48%" stop-color="#CDE8F6" stop-opacity=".12"/>
    <stop offset="100%" stop-color="#CDE8F6" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#7EAF6A"/>
    <stop offset="100%" stop-color="#4E8A4A"/>
  </linearGradient>
  <linearGradient id="mid" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#8FBF45"/>
    <stop offset="35%" stop-color="#5EA03A"/>
    <stop offset="100%" stop-color="#2F6E28"/>
  </linearGradient>
  <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#A8CE4A"/>
    <stop offset="40%" stop-color="#5FA336"/>
    <stop offset="100%" stop-color="#2C6A22"/>
  </linearGradient>
  <linearGradient id="fore" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#6EAE38"/>
    <stop offset="100%" stop-color="#1F5418"/>
  </linearGradient>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="14"/>
  </filter>
  <filter id="softer" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="22"/>
  </filter>
  <filter id="hillsoft" x="-5%" y="-5%" width="110%" height="110%">
    <feGaussianBlur stdDeviation="1.2"/>
  </filter>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>
<rect width="1600" height="900" fill="url(#sun)"/>
<!-- soft clouds: original arrangement, left and upper right, not a photograph -->
<g filter="url(#softer)" fill="#fff" fill-opacity=".72">
  <ellipse cx="260" cy="148" rx="140" ry="36"/>
  <ellipse cx="340" cy="132" rx="90" ry="30"/>
  <ellipse cx="200" cy="132" rx="80" ry="26"/>
</g>
<g filter="url(#soft)" fill="#fff" fill-opacity=".78">
  <ellipse cx="1180" cy="110" rx="170" ry="38"/>
  <ellipse cx="1280" cy="96" rx="110" ry="30"/>
  <ellipse cx="1090" cy="100" rx="90" ry="24"/>
</g>
<g filter="url(#soft)" fill="#fff" fill-opacity=".55">
  <ellipse cx="740" cy="168" rx="120" ry="26"/>
  <ellipse cx="820" cy="158" rx="70" ry="20"/>
</g>
<g filter="url(#soft)" fill="#E8F4FC" fill-opacity=".5">
  <ellipse cx="1480" cy="200" rx="90" ry="22"/>
</g>
<!-- distant cool ridge -->
<path d="M-20 560 C 180 520, 340 540, 520 500 C 700 460, 860 510, 1040 480 C 1220 450, 1400 500, 1620 470 L 1620 900 L -20 900 Z" fill="url(#far)" opacity=".85"/>
<!-- mid hill, rolling left-to-right -->
<path filter="url(#hillsoft)" d="M-20 640 C 120 560, 280 600, 460 540 C 680 468, 820 560, 980 520 C 1160 474, 1320 530, 1620 500 L 1620 900 L -20 900 Z" fill="url(#mid)"/>
<!-- sunlit near slope -->
<path filter="url(#hillsoft)" d="M-20 730 C 200 620, 420 680, 640 600 C 860 520, 1040 640, 1280 600 C 1460 570, 1580 620, 1620 610 L 1620 900 L -20 900 Z" fill="url(#near)"/>
<!-- foreground rise at the bottom left -->
<path d="M-20 820 C 160 740, 360 780, 540 760 C 740 736, 880 800, 900 900 L -20 900 Z" fill="url(#fore)" opacity=".92"/>
</svg>
